name: WatchTower SEC check

# Daily check of SEC EDGAR for the public-company watchlist. Runs on GitHub's servers; writes tools/sec_feed.json.
on:
  schedule:
    - cron: "23 22 * * 1-5"     # weekdays 22:23 UTC (5:23 or 6:23 pm ET), after most filings land
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sec_watch.py"
      - "tools/sec_candidates.txt"
      - ".github/workflows/sec.yml"

permissions:
  contents: write

concurrency:
  group: sec
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SEC EDGAR
        run: python3 tools/sec_watch.py > tools/sec_last_run.log 2>&1 || true; cat tools/sec_last_run.log
      - name: Commit feed
        run: |
          git config user.name "mtippleroc-prog"
          git config user.email "mtippleroc-prog@users.noreply.github.com"
          git add tools/sec_feed.json tools/sec_last_run.log 2>/dev/null || git add tools/sec_last_run.log
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "SEC feed $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
